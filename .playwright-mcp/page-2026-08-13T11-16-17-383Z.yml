      - heading "Iniciativas para sumar apoyo real" [level=1] [ref=f16e22]
      - paragraph [ref=f16e23]: Sumando Vidas organizará sus campañas en proyectos concretos, medibles y fáciles de seguir. El primero será Por Ellos.
    - article [ref=f16e26]:
      - generic [ref=f16e27]:
        - paragraph [ref=f16e28]: Primer proyecto de Sumando Vidas
        - heading "Por Ellos" [level=2] [ref=f16e29]
        - paragraph [ref=f16e30]: Una campaña deportiva y solidaria para recaudar el máximo dinero posible en apoyo a niños y familias afectados por el cáncer infantil.
        - paragraph [ref=f16e31]: Felipe, fundador de Sumando Vidas y superviviente de cáncer de niño, correrá junto a un equipo de la asociación las cinco grandes medias maratones de España. Cada carrera será una oportunidad para visibilizar la causa, sumar donaciones y construir comunidad alrededor de las familias.
