      - generic [ref=f11e31]:
        - paragraph [ref=f11e32]: Primer proyecto de Sumando Vidas
        - heading "Cinco medias maratones para sumar vidas" [level=2] [ref=f11e33]
        - paragraph [ref=f11e34]: Felipe, fundador de Sumando Vidas y superviviente de cáncer de niño, correrá junto a un equipo de la asociación las cinco grandes medias maratones de España. Cada carrera será una oportunidad para visibilizar la causa, sumar donaciones y construir comunidad alrededor de las familias.
      - generic [ref=f11e35]:
        - heading "Objetivos del proyecto" [level=2] [ref=f11e36]
        - list [ref=f11e37]:
          - listitem [ref=f11e38]: Recaudar fondos para proyectos de apoyo directo.
          - listitem [ref=f11e39]: Dar visibilidad al cáncer infantil desde una historia real de superación.
          - listitem [ref=f11e40]: Crear una comunidad de corredores, familias, empresas y donantes.
