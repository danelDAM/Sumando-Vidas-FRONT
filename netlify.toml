# Netlify: build de Vite. VITE_API_URL y VITE_SUPABASE_* se definen en el entorno del sitio
# (o en .env.local al construir desde local), nunca aquí.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: react-router resuelve las rutas en el cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
